<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>SmartHockey Light</title>
  <script>
    (function () {
      var target = '/SmartHockey-Tracking-Team-Light/';
      // Loop guard: only redirect if not already inside the project folder
      if (window.location.pathname.indexOf('/SmartHockey-Tracking-Team-Light/') !== 0) {
        // Insert meta-refresh as fallback before JS redirect
        document.write('<meta http-equiv="refresh" content="0;url=' + target + '">');
        window.location.replace(target);
      }
    })();
  </script>
</head>
<body></body>
</html>
