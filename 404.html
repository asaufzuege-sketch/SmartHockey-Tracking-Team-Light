<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>SmartHockey Light</title>
  <script>
    (function () {
      // Avoid redirect loop: only redirect if not already on index.html
      var path = window.location.pathname;
      if (path.indexOf('index.html') === -1) {
        // Determine base path dynamically (up to and including the repo folder)
        var base = path.replace(/\/[^\/]*$/, '/');
        window.location.replace(base + 'index.html');
      }
    })();
  </script>
</head>
<body></body>
</html>
