<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>SmartHockey Light</title>
  <script>
    (function () {
      var target = '/SmartHockey-Tracking-Team-Light/index.html';
      var current = window.location.pathname;
      // Only redirect when we are not already on the app entry point
      if (current.indexOf('/SmartHockey-Tracking-Team-Light/index.html') !== 0) {
        var meta = document.createElement('meta');
        meta.httpEquiv = 'refresh';
        meta.content = '0;url=' + target;
        document.head.appendChild(meta);
        window.location.replace(target);
      }
    })();
  </script>
</head>
<body></body>
</html>
